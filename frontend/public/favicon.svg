<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mvGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="64" height="64" rx="18" fill="#0d121e" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
  
  <g filter="url(#glow)">
    <!-- Cloud shape -->
    <path d="M46 36a8 8 0 0 0-4.2-14.8A12 12 0 0 0 19 23a9 9 0 0 0 .5 17.8" fill="none" stroke="url(#mvGradient)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Down Arrow -->
    <path d="M32 28v16M24 36l8 8 8-8" fill="none" stroke="url(#mvGradient)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>